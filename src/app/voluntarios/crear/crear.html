<div class="container mt-5">
  <h2 class="text-center mb-4">Registrar Voluntario</h2>

  <form id="voluntarioForm" (ngSubmit)="crearVoluntario()" #voluntarioForm="ngForm">

    <!-- Nombre -->
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" name="nombre"
             placeholder="Miguel Amarillas" [(ngModel)]="voluntario.nombre" required>
    </div>

    <!-- Apellido Paterno -->
    <div class="mb-3">
      <label for="apellido_pat" class="form-label">Apellido Paterno</label>
      <input type="text" class="form-control" id="apellido_pat" name="apellido_pat"
             [(ngModel)]="voluntario.apellido_pat" required>
    </div>

    <!-- Apellido Materno -->
    <div class="mb-3">
      <label for="apellido_mat" class="form-label">Apellido Materno</label>
      <input type="text" class="form-control" id="apellido_mat" name="apellido_mat"
             [(ngModel)]="voluntario.apellido_mat" required>
    </div>

    <!-- Teléfono -->
    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono</label>
      <input type="tel" class="form-control" id="telefono" name="telefono"
             placeholder="3315687423" [(ngModel)]="voluntario.telefono" required>
    </div>

    <!-- Dirección -->
    <div class="mb-3">
      <label for="direccion" class="form-label">Dirección</label>
      <input type="text" class="form-control" id="direccion" name="direccion"
             placeholder="Calle 123, Col. Centro" [(ngModel)]="voluntario.direccion" required>
    </div>

    <!-- Fecha de Registro -->
    <div class="mb-3">
      <label class="form-label">Fecha de registro</label>
      <input type="text" class="form-control" value="Se asignará automáticamente" disabled>
    </div>

    <!-- Foto (opcional) -->
    <div class="mb-3">
      <label for="foto" class="form-label">Subir Foto del Voluntario</label>
      <input type="file" class="form-control" accept="foto/*" id="foto" name="foto"
             (change)="onArchivoSeleccionado($event)">
    </div>

    <button type="submit" class="btn btn-primary w-100">Registrar Voluntario</button>
  </form>
</div>
