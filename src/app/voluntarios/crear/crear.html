<div class="container mt-5">
  <h2 class="text-center mb-4">Registrar Voluntario</h2>
  <form id="voluntarioForm">

    <!-- Nombre -->
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Miguel Amarillas" required>
    </div>

    <!-- Correo -->
    <div class="mb-3">
      <label for="correo" class="form-label">Correo</label>
      <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@bamx.org" required>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="contraseña" required>
    </div>

   <!-- Rol -->
<div class="mb-3">
  <label for="rol" class="form-label">Rol</label>
  <select class="form-select" id="rol" name="rol" required>
    <option value="" disabled selected>Selecciona tu rol</option>
    <option value="superAdmin">Voluntario</option>
  </select>
</div>


    <!-- Teléfono -->
    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono</label>
      <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="3315687423" required>
    </div>

    <!-- Área Asignada -->
<div class="mb-3">
  <label for="area_asignada" class="form-label">Área que se te ha asignado</label>
  <select class="form-select" id="area_asignada" name="area_asignada" required>
    <option value="" disabled selected>Selecciona un área</option>
    <option value="Clasificación de Alimentos">Clasificación de Alimentos</option>
    <option value="Entrega a Comunidades">Entrega a Comunidades</option>
  </select>
</div>


    <!-- Fecha de Registro -->
    <div class="mb-3">
      <label for="fecha_registro" class="form-label">Fecha de Registro</label>
      <input type="datetime-local" class="form-control" id="fecha_registro" name="fecha_registro" value="2025-10-12T09:30" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Registrar Voluntario</button>
  </form>
</div>

<!-- Bootstrap JS (opcional si usas componentes JS) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
