<div class="container mt-5" *ngIf="!cargando; else cargandoTpl">
  <div class="card shadow-lg p-4">
    <h2 class="text-center mb-4 text-primary">Editar Voluntario</h2>

    <!-- Mensaje -->
    <div *ngIf="mensaje" class="alert text-center" [ngClass]="{
        'alert-success': mensaje.includes('correctamente'),
        'alert-danger': mensaje.includes('Error') || mensaje.includes('No se pudo')
      }">
      {{ mensaje }}
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="actualizarVoluntario()" #form="ngForm">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="voluntario.nombre" name="nombre" required />
        </div>

        <div class="col-md-4">
          <label class="form-label">Apellido Paterno</label>
          <input type="text" class="form-control" [(ngModel)]="voluntario.apellido_pat" name="apellido_pat" required />
        </div>

        <div class="col-md-4">
          <label class="form-label">Apellido Materno</label>
          <input type="text" class="form-control" [(ngModel)]="voluntario.apellido_mat" name="apellido_mat" required />
        </div>

        <div class="col-md-6">
          <label class="form-label">Teléfono</label>
          <input type="text" class="form-control" [(ngModel)]="voluntario.telefono" name="telefono" required />
        </div>

        <div class="col-md-6">
          <label class="form-label">Dirección</label>
          <input type="text" class="form-control" [(ngModel)]="voluntario.direccion" name="direccion" required />
        </div>

        <div class="col-md-6">
          <label class="form-label">Estado</label>
          <select class="form-select" [(ngModel)]="voluntario.estado" name="estado">
            <option [ngValue]="true">Activo</option>
            <option [ngValue]="false">Inactivo</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Foto</label>
          <input type="file" class="form-control" (change)="onFileSelected($event)" />
        </div>

        <!-- Vista previa -->
        <div class="col-md-6 mt-3" *ngIf="voluntario.foto">
          <label class="form-label d-block">Foto actual:</label>
          <img [src]="voluntario.foto" alt="Foto actual" class="img-thumbnail rounded" width="150" height="150" />
        </div>

        <div class="col-md-6 mt-3" *ngIf="selectedFile">
          <label class="form-label d-block">Nueva foto seleccionada:</label>
          <img [src]="selectedFile ? (selectedFile | fileUrl) : ''" alt="Nueva foto" class="img-thumbnail rounded" width="150" height="150" />
        </div>
      </div>

      <div class="mt-4 text-center">
        <button type="submit" class="btn btn-success me-2" [disabled]="form.invalid">
           Guardar Cambios
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancelar()">
           Cancelar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Plantilla de carga -->
<ng-template #cargandoTpl>
  <div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
    <div class="text-center">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
      <p class="mt-3 text-secondary">Cargando información del voluntario...</p>
    </div>
  </div>
</ng-template>
