<div class="container mt-5">
  <h2 class="text-center mb-4">Registrar Área</h2>
  <form id="areaForm">

    <!-- Nombre -->
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre del Área" required>
    </div>

    <!-- Descripción -->
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <textarea class="form-control" id="descripcion" name="descripcion" rows="3" placeholder="Descripción del Área" required></textarea>
    </div>

    <!-- Responsable -->
    <div class="mb-3">
      <label for="responsable" class="form-label">Responsable</label>
      <input type="text" class="form-control" id="responsable" name="responsable" placeholder="Nombre del Responsable" required>

    </div>

    <button type="submit" class="btn btn-primary w-100">Registrar Área</button>
  </form>
</div>

<!-- Bootstrap JS (opcional si usas componentes JS) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
