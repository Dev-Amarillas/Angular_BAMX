<div class="container mt-4">
  <h2>Areas</h2>

  <div class="mb-3">
    <button class="btn btn-primary me-2" (click)="mostrar = 'listar'">Listar</button>
    <button class="btn btn-success" (click)="mostrar = 'crear'">Crear</button>
  </div>

  <hr>

  <!-- Alterna entre componentes -->
  <app-listar *ngIf="mostrar === 'listar'"></app-listar>
  <app-crear *ngIf="mostrar === 'crear'"></app-crear>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
