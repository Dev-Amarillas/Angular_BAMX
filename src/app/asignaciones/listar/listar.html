<div class="container mt-5">
  <h2 class="text-center mb-4">Listado de Asignaciones</h2>

  <!-- Tabla de asignaciones -->
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Voluntario ID</th>
          <th>Area ID</th>
          <th>Fecha de asignacion</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>

        <tr *ngFor="let asignacion of asignaciones">
          <td>{{ asignacion.id }}</td>
          <td>{{ asignacion.id_voluntario }}</td>
          <td>{{ asignacion.id_area }}</td>
          <td>{{ asignacion.fecha_asignacion | date:'short' }}</td>
          <td>{{ asignacion.estado ? 'Activo' : 'Inactivo' }}</td>
        </tr>
        
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
