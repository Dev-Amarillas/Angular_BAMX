<div class="container mt-5 text-center">
  <h2 class="text-danger fw-bold mb-4">Eliminar Asignación</h2>

  <div class="card shadow p-4 mx-auto" style="max-width: 450px;">
    <ng-container *ngIf="asignacion; else cargando">
      <p class="fs-5 mb-4">
        ¿Seguro que deseas eliminar la asignación
        <span class="fw-bold text-dark">#{{ asignacion.id }}</span>?
      </p>

      <div class="d-flex justify-content-center gap-3">
        <button class="btn btn-danger px-4" (click)="eliminarAsignacion()">
          Sí, eliminar
        </button>
        <button class="btn btn-secondary px-4" (click)="cancelar()">
          Cancelar
        </button>
      </div>
    </ng-container>

    <ng-template #cargando>
      <p class="text-muted">Cargando información...</p>
    </ng-template>
  </div>
</div>
