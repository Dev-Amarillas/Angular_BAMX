<div class="container mt-5">
  <h2 class="text-center mb-4 fw-bold text-dark">
    <i class="bi bi-pencil-square"></i> Editar Asignación
  </h2>

  <div class="card shadow-lg p-4 mx-auto border-0" style="max-width: 600px;">

    <!-- Mensaje de error -->
    <div *ngIf="error" class="alert alert-danger text-center py-2">
      {{ error }}
    </div>

    <!-- Cargando -->
    <div *ngIf="cargando" class="text-center py-4">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Cargando datos...</p>
    </div>

    <!-- Formulario -->
    <form *ngIf="!cargando" (ngSubmit)="guardarCambios()">

      <!-- Voluntario -->
      <div class="mb-3">
        <label for="voluntario_id" class="form-label fw-semibold">Voluntario</label>
        <select
          id="voluntario_id"
          class="form-select"
          [(ngModel)]="asignacion.voluntario_id"
          name="voluntario_id"
          required
        >
          <option value="" disabled selected>Seleccione un voluntario</option>
          <option *ngFor="let v of voluntarios" [value]="v.id">{{ v.nombre }}</option>
        </select>
      </div>

      <!-- Área -->
      <div class="mb-3">
        <label for="area_id" class="form-label fw-semibold">Área</label>
        <select
          id="area_id"
          class="form-select"
          [(ngModel)]="asignacion.area_id"
          name="area_id"
          required
        >
          <option value="" disabled selected>Seleccione un área</option>
          <option *ngFor="let a of areas" [value]="a.id">{{ a.nombre }}</option>
        </select>
      </div>

      <!-- Estado -->
      <div class="mb-3">
        <label for="estado" class="form-label fw-semibold">Estado</label>
        <select
          id="estado"
          class="form-select"
          [(ngModel)]="asignacion.estado"
          name="estado"
          required
        >
          <option value="" disabled selected>Seleccione un estado</option>
          <option *ngFor="let e of estados" [value]="e">{{ e }}</option>
        </select>
      </div>

      <!-- Botones -->
      <div class="d-flex justify-content-center gap-3 mt-4">
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-save"></i> Guardar Cambios
        </button>
        <button type="button" class="btn btn-secondary px-4" (click)="cancelar()">
          <i class="bi bi-x-circle"></i> Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
