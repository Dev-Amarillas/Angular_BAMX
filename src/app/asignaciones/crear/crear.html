<div class="container mt-5">
  <h2 class="text-center mb-4">Registrar Asignación</h2>

  <form (ngSubmit)="crearAsignacion()" #asignacionForm="ngForm">

    <!-- Voluntario ID -->
    <div class="mb-3">
      <label for="voluntario_id" class="form-label">Voluntario ID</label>
      <input type="number" class="form-control" id="voluntario_id" name="voluntario_id"
             [(ngModel)]="asignacion.voluntario_id" required>
    </div>

    <!-- Área ID -->
    <div class="mb-3">
      <label for="area_id" class="form-label">Área ID</label>
      <input type="number" class="form-control" id="area_id" name="area_id"
             [(ngModel)]="asignacion.area_id" required>
    </div>

    <!-- Fecha (automática) -->
    <div class="mb-3">
      <label class="form-label">Fecha de Asignación</label>
      <input type="text" class="form-control" value="Se asignará automáticamente" disabled>
    </div>

    <!-- Estado -->
    <div class="mb-3">
      <label for="estado" class="form-label">Estado</label>
      <select id="estado" name="estado" class="form-select" [(ngModel)]="asignacion.estado" required>
        <option [ngValue]="true">Activo</option>
        <option [ngValue]="false">Inactivo</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">Registrar Asignación</button>
  </form>
</div>
