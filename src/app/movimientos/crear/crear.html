<div class="container mt-5">
  <h2 class="text-center mb-4">Registrar movimiento</h2>
  <form id="MovimientoForm">

    <!-- Tipo -->
    <div class="mb-3">
      <label for="tipo" class="form-label">Tipo</label>
      <select class="form-select" id="tipo" name="tipo" required>
        <option value="" disabled selected>Selecciona un tipo</option>
        <option value="Entrada">Entrada</option>
        <option value="Salida">Salida</option>
      </select>
    </div>

    <!-- Descripción -->
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <input type="text" class="form-control" id="descripcion" name="descripcion" placeholder="Descripción del movimiento" required>
    </div>

    <!-- Cantidad (kg) -->
    <div class="mb-3">
      <label for="cantidad" class="form-label">Cantidad (kg)</label>
      <input type="number" class="form-control" id="cantidad" name="cantidad" placeholder="Cantidad en kilogramos" required>
    </div>

   <!-- Fecha -->
<div class="mb-3">
  <label for="fecha" class="form-label">Fecha</label>
  <input type="date" class="form-control" id="fecha" name="fecha" required>
</div>

    <!-- registrado por -->
    <div class="mb-3">
      <label for="registrado_por" class="form-label">Registrado Por</label>
      <input type="text" class="form-control" id="registrado_por" name="registrado_por" placeholder="Nombre del responsable" required>
    </div>

    <!-- Área id -->
<div class="mb-3">
  <label for="area_id" class="form-label">Área ID</label>
  <input type="text" class="form-control" id="area_id" name="area_id" placeholder="ID del área" required>
</div>
    
    <button type="submit" class="btn btn-primary w-100">Registrar Movimiento</button>
  </form>
</div>

<!-- Bootstrap JS (opcional si usas componentes JS) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
