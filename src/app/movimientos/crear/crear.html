<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h2 class="text-center mb-4">Registrar Movimiento</h2>

    <form id="MovimientoForm" (ngSubmit)="crearMovimiento()" #movimientoForm="ngForm">
      <!-- Voluntario ID -->
      <div class="mb-3">
        <label for="voluntario_id" class="form-label">ID del Voluntario</label>
        <input
          type="number"
          class="form-control"
          id="voluntario_id"
          name="voluntario_id"
          [(ngModel)]="movimiento.voluntario_id"
          placeholder="Ejemplo: 12"
          required
        />
      </div>

      <!-- Cantidad KG -->
      <div class="mb-3">
        <label for="cantidad" class="form-label">Cantidad (KG)</label>
        <input
          type="number"
          class="form-control"
          id="cantidad"
          name="cantidad"
          [(ngModel)]="movimiento.cantidad"
          placeholder="Ejemplo: 150"
          required
        />
      </div>

      <!-- Descripción -->
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción del movimiento</label>
        <textarea
          id="descripcion"
          name="descripcion"
          class="form-control"
          rows="3"
          placeholder="Escribe una breve descripción del movimiento..."
          [(ngModel)]="movimiento.descripcion"
          required
        ></textarea>
      </div>

      <button type="submit" class="btn btn-success w-100">
        <i class="bi bi-box-arrow-in-down"></i> Registrar Movimiento
      </button>
    </form>
  </div>
</div>
