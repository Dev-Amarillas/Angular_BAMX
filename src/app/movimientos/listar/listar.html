<div class="container mt-5">
  <h2 class="text-center mb-4">Listado de Movimientos</h2>

  <!-- Tabla de movimientos -->
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Tipo</th>
          <th>Descripción</th>
          <th>Cantidad_KG</th>
          <th>Fecha</th>
          <th>Registrado_por</th>
          <th>Área_ID</th>
        </tr>
      </thead>
      <tbody>

        <tr *ngFor="let movimiento of movimientos">
          <td>{{ movimiento.tipo }}</td>
          <td>{{ movimiento.descripcion }}</td>
          <td>{{ movimiento.cantidad_kg }}</td>
          <td>{{ movimiento.fecha | date:'short' }}</td>
          <td>{{ movimiento.registrado_por }}</td>
          <td>{{ movimiento.area_id }}</td>
        </tr>
        
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
