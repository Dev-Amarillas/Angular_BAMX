<div class="container mt-5">
  <h2 class="text-center mb-4 fw-bold text-dark">Listado de Administradores</h2>

  <div class="table-responsive shadow rounded">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Usuario</th>
          <th>Correo</th>
          <th>Fecha de Creación</th>
          <th>Imagen</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let admin of administradores">
          <td>{{ admin.id }}</td>
          <td>{{ admin.nombre }}</td>
          <td>{{ admin.usuario }}</td>  
          <td>{{ admin.correo }}</td>
          <td>{{ admin.fecha_creacion }}</td>
          <td>
            <img *ngIf="admin.imagen" [src]="'http://localhost:3000/uploads/' + admin.imagen" 
                 alt="{{ admin.nombre }}" class="img-foto">
          </td>
          <td class="text-center">
            <a [routerLink]="['/administradores/editar', admin.id]" class="btn btn-outline-warning btn-sm me-2">
              Editar
            </a>
            <a [routerLink]="['/administradores/eliminar', admin.id]" class="btn btn-outline-danger btn-sm">
              Eliminar
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
