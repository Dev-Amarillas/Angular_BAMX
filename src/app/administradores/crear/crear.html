<div class="container d-flex justify-content-center mt-5">
  <div class="card shadow-lg w-75">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">Registrar Administrador</h2>

      <form #form="ngForm" (ngSubmit)="crearAdministrador()">

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label>
            <input [(ngModel)]="administrador.nombre" type="text" id="nombre" name="nombre"
                   placeholder="Miguel Amarillas" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label for="usuario" class="form-label">Usuario</label>
            <input [(ngModel)]="administrador.usuario" type="text" id="usuario" name="usuario"
                   placeholder="miguel.amarillas" class="form-control" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="correo" class="form-label">Correo</label>
            <input [(ngModel)]="administrador.correo" type="email" id="correo" name="correo"
                   placeholder="miguel.amarillas@bamx.org" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input [(ngModel)]="administrador.contrasena" type="password" id="contrasena" name="contrasena"
                   placeholder="Contraseña" class="form-control" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="confirmar_contrasena" class="form-label">Confirmar Contraseña</label>
            <input [(ngModel)]="confirmar_contrasena" type="password" id="confirmar_contrasena"
                   name="confirmar_contrasena" placeholder="Confirmar Contraseña" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Fecha de Creación</label>
            <input type="text" class="form-control" value="Se asignará automáticamente" disabled>
          </div>
        </div>

        <div class="mb-3">
          <label for="imagen" class="form-label">Foto del Administrador</label>
          <input type="file" id="imagen" name="imagen" (change)="onArchivoSeleccionado($event)"
                 class="form-control" accept="image/*">
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary btn-lg shadow-sm">Registrar Administrador</button>
        </div>

        <p *ngIf="error" class="text-danger mt-3">{{ error }}</p>
      </form>
    </div>
  </div>
</div>
